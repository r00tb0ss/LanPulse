# Runs the same checks as the old GitHub workflow, and publishes docs/ as the project page (GitLab Pages).
stages: [test, deploy, verify]

checks:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq nodejs >/dev/null
  script:
    - python -m compileall -q .
    - for f in static/*.js; do node --check "$f"; done
    - |
      python - <<'PY'
      from html.parser import HTMLParser
      from pathlib import Path
      from urllib.parse import unquote, urlsplit

      class LocalAssets(HTMLParser):
          def __init__(self):
              super().__init__()
              self.refs = []

          def handle_starttag(self, tag, attrs):
              for key, value in attrs:
                  if key in ("src", "href") and value:
                      self.refs.append(value)

      failures = []
      checks = (
          (Path("static/index.html"), Path("static"), "/static/", "vendor/"),
          (Path("docs/index.html"), Path("docs"), "", ""),
      )
      for html_file, root, prefix, excluded in checks:
          parser = LocalAssets()
          parser.feed(html_file.read_text(encoding="utf-8"))
          for ref in parser.refs:
              url = urlsplit(ref)
              if url.scheme or url.netloc or not url.path:
                  continue
              if prefix:
                  if not url.path.startswith(prefix):
                      continue
                  relative = url.path[len(prefix):]
                  if relative.startswith(excluded):
                      continue
              else:
                  if url.path.startswith("/"):
                      continue
                  relative = url.path
              target = (root / unquote(relative)).resolve()
              if not target.is_relative_to(root.resolve()) or not target.is_file():
                  failures.append(f"{html_file} references missing asset: {ref}")
      if failures:
          raise SystemExit("\n".join(failures))
      print("Website and app page asset references are valid.")
      PY
    - python -m unittest discover -s tests
    - VER=$(grep -m1 -oP '^VERSION = "\K[^"]+' app.py); test -f "docs/releases/$VER.md"

pages:
  stage: deploy
  image: alpine:3.20
  needs:
    - checks
    - job: publish-release
      optional: true
  script:
    - mkdir public && cp -r docs/* public/
    - apk add --no-cache curl jq
    - VER=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app.py | head -n 1)
    - API="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
    # latest.json tells the in-app updater the newest version without touching the rate-limited API.
    # Only written when the release (and so its lanpulse.zip link) already exists; the link is read from the
    # release itself, so it works for releases made by tools/release_gitlab.py or by publish-release.
    - |
      RELEASE=$(curl -fsS -H "JOB-TOKEN: $CI_JOB_TOKEN" "$API/releases/v$VER")
      URL=$(printf '%s' "$RELEASE" | jq -r '[.assets.links[] | select(.name=="lanpulse.zip")][0] | (.direct_asset_url // .url) // empty')
      SUM_URL=$(printf '%s' "$RELEASE" | jq -r '[.assets.links[] | select(.name=="lanpulse.zip.sha256")][0] | (.direct_asset_url // .url) // empty')
      SHA=""
      if [ -n "$SUM_URL" ]; then SHA=$(curl -fsS -H "JOB-TOKEN: $CI_JOB_TOKEN" "$SUM_URL" | awk 'NR==1 {print $1}'); fi
      if [ -n "$URL" ] && printf '%s' "$SHA" | grep -qE '^[a-fA-F0-9]{64}
      else
        echo "No release for v$VER yet, so no latest.json"
      fi
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# When a merge to main changes app.py (where VERSION lives), publish a release with lanpulse.zip, unless that version
# already has one. Notes come from docs/releases/<version>.md. Also runs from a manual pipeline on main.
publish-release:
  stage: deploy
  image: alpine:3.20
  allow_failure: true   # Pages must still deploy if publication fails; verify-release-publication reports failure afterward.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: [app.py]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"
  script:
    - apk add --no-cache curl git jq
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - VER=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app.py | head -n 1)
    - test -n "$VER"
    - API="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
    - |
      if curl -fsS -o /dev/null -H "JOB-TOKEN: $CI_JOB_TOKEN" "$API/releases/v$VER"; then
        echo "v$VER already released"; exit 0
      fi
    - git archive --prefix=lanpulse/ HEAD -o lanpulse.zip --format=zip
    - sha256sum lanpulse.zip > lanpulse.zip.sha256
    - PKG="$API/packages/generic/lanpulse/$VER/lanpulse.zip"
    - SUM_PKG="$API/packages/generic/lanpulse/$VER/lanpulse.zip.sha256"
    - |
      curl -fsS -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file lanpulse.zip "$PKG"
      curl -fsS -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file lanpulse.zip.sha256 "$SUM_PKG"
    - |
      if [ -f "docs/releases/$VER.md" ]; then cp "docs/releases/$VER.md" notes.md; else echo "LanPulse $VER" > notes.md; fi
    - |
      jq -n --arg tag "v$VER" --arg name "LanPulse $VER" --arg ref "$CI_COMMIT_SHA" --arg url "$PKG" --arg sum "$SUM_PKG" --rawfile desc notes.md \
        '{tag_name: $tag, name: $name, ref: $ref, description: $desc, assets: {links: [{name: "lanpulse.zip", url: $url, link_type: "package"}, {name: "lanpulse.zip.sha256", url: $sum, link_type: "package"}]}}' > release.json
    - |
      curl -fsS -X POST -H "JOB-TOKEN: $CI_JOB_TOKEN" -H "Content-Type: application/json" --data @release.json "$API/releases"
    - echo "Published v$VER"

# This runs after the deployment stage, so it can report a failed publication without blocking Pages.
verify-release-publication:
  stage: verify
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: [app.py]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"
  script:
    - apk add --no-cache curl jq
    - VER=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app.py | head -n 1)
    - API="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
    - |
      RELEASE=$(curl -fsS -H "JOB-TOKEN: $CI_JOB_TOKEN" "$API/releases/v$VER") || {
        echo "ERROR: v$VER was not published successfully; inspect the publish-release job."
        exit 1
      }
      URL=$(printf '%s' "$RELEASE" | jq -r '[.assets.links[] | select(.name=="lanpulse.zip")][0] | (.direct_asset_url // .url) // empty')
      SUM_URL=$(printf '%s' "$RELEASE" | jq -r '[.assets.links[] | select(.name=="lanpulse.zip.sha256")][0] | (.direct_asset_url // .url) // empty')
      if [ -z "$URL" ] || [ -z "$SUM_URL" ]; then
        echo "ERROR: v$VER is missing its ZIP or SHA-256 release asset."
        exit 1
      fi
      SHA=$(curl -fsS -H "JOB-TOKEN: $CI_JOB_TOKEN" "$SUM_URL" | awk 'NR==1 {print $1}')
      printf '%s' "$SHA" | grep -qE '^[a-fA-F0-9]{64}
; then
        jq -n --arg tag "v$VER" --arg v "$VER" --arg a "$URL" --arg h "$SHA" --arg u "$CI_PROJECT_URL/-/releases/v$VER" '{tag: $tag, version: $v, asset_url: $a, sha256: $h, url: $u}' > public/latest.json
        echo "latest.json written for v$VER with SHA-256 verification"
      else
        echo "No release for v$VER yet, so no latest.json"
      fi
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

