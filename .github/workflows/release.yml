name: Release
# Publish only after the CI workflow has completed successfully for a push to main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: lanpulse-release-main
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Publish if this version has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          MAIN_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$MAIN_SHA" != "$RELEASE_SHA" ]; then
            echo "A newer main commit exists ($MAIN_SHA); skipping stale CI result $RELEASE_SHA. Its own successful CI workflow_run will retry release publication."
            exit 0
          fi
          VER=$(grep -m1 -oP '^VERSION = "\K[^"]+' app.py)
          if gh release view "v$VER" >/dev/null 2>&1; then echo "v$VER already released"; exit 0; fi
          git archive --prefix=lanpulse/ "$RELEASE_SHA" -o /tmp/lanpulse.zip --format=zip
          # The in-app updater refuses a release without this checksum file.
          (cd /tmp && sha256sum lanpulse.zip > lanpulse.zip.sha256)
          if [ -f "docs/releases/$VER.md" ]; then NOTES=(-F "docs/releases/$VER.md"); else NOTES=(--generate-notes); fi
          gh release create "v$VER" /tmp/lanpulse.zip /tmp/lanpulse.zip.sha256 --title "LanPulse $VER" --target "$RELEASE_SHA" "${NOTES[@]}"
